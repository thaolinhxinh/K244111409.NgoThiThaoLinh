<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Newborn Registration</title>
</head>

<body style="background-color:#008b8b; color:white; ">
    <div style="text-align:center; padding-top:20px;">
        <img src="images/Logo.gif" alt="Newborn Registration">
    </div>
    <h1 style="text-align:center;">
        Newborn Registration
    </h1> 

    <form>
        <p>
            Date:
            <input type="date" name="date">
        </p>

        <p>
            1) Infant's first name:
            <input type="text" name="infantFirstName">

            Last:
            <input type="text" name="infantLastName">
        </p>

        <p>
            2) Medical Record #:
            <input type="text" name="medicalRecord">
        </p>

        <p>
            3) Date of birth
            <input type="date" name="dateOfBirth">
        </p>

        <p>
            4) Birth weight :
            <input type="text" name="birthWeight">
        </p>

        <p>
            5) APGAR score:
            <input type="text" name="apgarScore">
        </p>

        <p>
            6) Mother's first name:
            <input type="text" name="motherFirstName">

            Last:
            <input type="text" name="motherLastName">
        </p>

        <p>
            7) Father's first name :
            <input type="text" name="fatherFirstName">

            Last:
            <input type="text" name="fatherLastName">
        </p>

        <p>
            8) Physician (check <br>
            all that apply.)</p>

            <select multiple size="4">
                <option>Dr. Warren Albert</option>
                <option>Dr. Maria Alvarez</option>
                <option>Dr. Karen Brinkman</option>
                <option>Dr. Micheal Kerry</option>
            </select>
        <div style="margin-left:200px; margin-top:20px;">
            <input type="submit" value="Register">

            <input type="reset" value="Cancel">
        </div>
    </form>
</body>
</html>
