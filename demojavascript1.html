<HTML>
    <head> 
        <title> cong 2 so  </title>    
        <script type="text/javascript">
            function xulycong(a,b)
            {
                ketqua=eval(a)+eval(b)
                alert(ketqua)
            }
        </script>
    </head>
    <body>
        <table>
            <tr>
                <td> Hệ số a </td>
                <td>
                    <input type="text" id="hsa">
                </td>
            </tr>
            <tr>
                <td> Hệ số b </td>
                <td>
                    <input type="text" id="hsb">
                </td>
            </tr>
            <tr>
                <td colspan=2> 
                    <input type="button" value="Tính cộng" 
                    onclick="xulycong(hsa.value, hsb.value)">
                </td>
            </tr>
        </table>
    </body>
